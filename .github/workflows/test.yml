name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      # Most files share one module graph per worker, so a test that leaks
      # state can pass or fail by file order. A shuffled, serial run catches
      # that; rerun locally with the same seed to reproduce a failure.
      - name: Shuffled order (seed ${{ github.run_number }})
        run: npm run test:shuffle -- --sequence.seed=${{ github.run_number }}
