<div class="litm--play-actions">
	<p class="litm--play-actions__prompt">{{localize "LITM.Ui.what_do_you_do"}}</p>
	<div class="litm--play-actions__buttons flexrow gap-sm">
		<button type="button" data-action="openRollDialog" data-tour="roll-button"
			data-tooltip="{{localize 'LITM.Ui.roll'}}" aria-label="{{localize 'LITM.Ui.roll'}}">
			<i class="fa-solid fa-dice" aria-hidden="true"></i>
		</button>
		<button type="button" data-action="openActionsApp"
			data-tooltip="{{localize 'LITM.Actions.app_title'}}" aria-label="{{localize 'LITM.Actions.app_title'}}">
			<i class="fa-solid fa-scroll" aria-hidden="true"></i>
		</button>
		<button type="button" class="litm--sacrifice-button" data-action="openSacrificeRoll"
			data-tooltip="{{localize 'LITM.Ui.roll_sacrifice'}}"
			aria-label="{{localize 'LITM.Ui.roll_sacrifice'}}">
			<i class="fa-solid fa-skull" aria-hidden="true"></i>
		</button>
		{{#if showCamping}}
		<button type="button" data-action="openCamping"
			data-tooltip="{{localize 'LITM.Ui.camping_open'}}" aria-label="{{localize 'LITM.Ui.camping_open'}}">
			<i class="fa-solid fa-campground" aria-hidden="true"></i>
		</button>
		{{/if}}
	</div>
</div>
