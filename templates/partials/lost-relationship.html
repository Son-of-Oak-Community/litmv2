{{!-- A relationship whose Hero was deleted. It stays in the data but is never
     offered in a roll or at camp; this row says so and lets it be removed. --}}
<li class="flexrow gap-sm litm--lost-relationship">
	<span class="flexrow gap-sm hint litm--lost-relationship__who" data-tooltip="{{localize 'LITM.Ui.relationship_lost_hint'}}">
		<i class="fa-solid fa-user-slash" aria-hidden="true"></i>
		<span>{{localize "LITM.Ui.relationship_lost"}}</span>
	</span>
	<span class="hint litm--lost-relationship__tag">{{relationship.tag}}</span>
	<button type="button" class="noflex" data-action="removeEffect" data-id="{{relationship.effectId}}"
		data-tooltip="{{localize 'LITM.Ui.remove'}}" aria-label="{{localize 'LITM.Ui.remove'}}">
		<i class="fa-solid fa-trash" aria-hidden="true"></i>
	</button>
</li>
