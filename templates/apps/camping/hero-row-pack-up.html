{{#if hero.hasBackpack}}
{{#if (and hero.canEdit hero.backpackTagIds)}}
<button type="button" class="litm-camping-scene__btn" data-action="backpack-keep-all"
	data-hero-id="{{hero.id}}" data-effect-ids="{{hero.backpackTagIds}}"
	data-kept="{{#if hero.allBackpackKept}}false{{else}}true{{/if}}">
	{{#if hero.allBackpackKept}}
	<i class="fa-solid fa-xmark" aria-hidden="true"></i> {{localize "LITM.Ui.camping_backpack_keep_none"}}
	{{else}}
	<i class="fa-solid fa-check-double" aria-hidden="true"></i> {{localize "LITM.Ui.camping_backpack_keep_all"}}
	{{/if}}
</button>
{{/if}}
<ul class="litm-camping-scene__pills plain">
	{{#each hero.backpackTags}}
	<li>
		<label class="litm-camping-scene__pill{{#unless kept}} marked{{/unless}}{{#if disabled}} litm-camping-scene__pill--inactive{{/if}}"
			data-tooltip="{{#if disabled}}{{#if kept}}{{localize 'LITM.Ui.camping_backpack_will_reactivate'}}{{else}}{{localize 'LITM.Ui.camping_backpack_stays_inactive'}}{{/if}}{{else}}{{#if kept}}{{localize 'LITM.Ui.camping_backpack_kept'}}{{else}}{{localize 'LITM.Ui.camping_backpack_will_deactivate'}}{{/if}}{{/if}}">
			{{#if ../hero.canEdit}}
			<input type="checkbox" data-update="backpack-kept"
				data-hero-id="{{../hero.id}}" data-effect-id="{{id}}"
				{{#if kept}}checked{{/if}}>
			{{/if}}
			<span class="litm-tag{{#if isSingleUse}} litm--single-use{{/if}}">{{name}}{{#if isSingleUse}}<span class="litm--single-use-mark">✱</span>{{/if}}</span>
			{{#if isHidden}}<i class="fa-solid fa-eye-slash litm-camping-scene__hidden-mark" data-tooltip="{{localize 'LITM.Terms.hidden'}}" aria-label="{{localize 'LITM.Terms.hidden'}}"></i>{{/if}}
		</label>
	</li>
	{{/each}}
</ul>
{{else}}
<p class="hint">{{localize "LITM.Ui.camping_no_backpack"}}</p>
{{/if}}
