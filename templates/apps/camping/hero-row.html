<header class="litm-camping-scene__row-header">
	{{#if canView}}
	<img class="litm-camping-scene__hero-portrait litm-camping-scene__hero-link" src="{{img}}" alt=""
		data-action="open-sheet" data-hero-id="{{id}}">
	{{!-- A real button so the keyboard can open the sheet too. --}}
	<button type="button" class="litm-camping-scene__hero-name litm-camping-scene__hero-link"
		data-action="open-sheet" data-hero-id="{{id}}"
		data-tooltip="{{localize 'LITM.Ui.camping_open_sheet'}}">{{name}}</button>
	{{else}}
	<img class="litm-camping-scene__hero-portrait" src="{{img}}" alt="{{name}}">
	<span class="litm-camping-scene__hero-name">{{name}}</span>
	{{/if}}
	{{#unless canEdit}}{{#unless ready}}
	<span class="litm-camping-scene__readonly-tag">{{localize "LITM.Ui.camping_read_only"}}</span>
	{{/unless}}{{/unless}}
	{{#if canToggleReady}}
	<button type="button" class="litm-camping-scene__ready{{#if ready}} active{{/if}}"
		data-action="toggle-ready" data-hero-id="{{id}}"
		data-tooltip="{{#if ready}}{{localize 'LITM.Ui.camping_ready_undo_hint'}}{{else}}{{localize 'LITM.Ui.camping_ready_hint'}}{{/if}}"
		aria-pressed="{{#if ready}}true{{else}}false{{/if}}">
		<i class="fa-solid fa-check" aria-hidden="true"></i> {{localize "LITM.Ui.camping_ready"}}
	</button>
	{{else if ready}}
	<span class="litm-camping-scene__ready active"
		data-tooltip="{{localize 'LITM.Ui.camping_ready_gm_hint'}}">
		<i class="fa-solid fa-check" aria-hidden="true"></i> {{localize "LITM.Ui.camping_ready"}}
	</span>
	{{/if}}
</header>
